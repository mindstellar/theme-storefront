name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 33061:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The per-language test saves through core's preferences: the newest stable 7.x release, or develop.
      - name: Pick the Shopclass 7 version
        id: core
        run: |
          ref="$(git ls-remote --tags --refs https://github.com/mindstellar/shopclass | awk -F/ '{print $3}' | grep -E '^7\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          echo "ref=${ref:-develop}" >> "$GITHUB_OUTPUT"

      - name: Check out Shopclass
        uses: actions/checkout@v7
        with:
          repository: mindstellar/shopclass
          ref: ${{ steps.core.outputs.ref }}
          path: core

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli, mbstring

      - name: Install Shopclass dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --working-dir=core

      - name: Run tests
        env:
          SHOPCLASS_CORE: ${{ github.workspace }}/core/
          DRIFT_DB_PORT: '33061'
        run: |
          php tests/messaging.php
          php tests/place-field.php
          php tests/text-per-language.php
